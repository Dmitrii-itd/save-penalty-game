<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Сэйв: Пенальти (фикс касаний)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0f; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #balance { font-size: 24px; margin: 10px; color: #00f0ff; }
        button, select { background: #ff0055; border: none; color: white; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 5px; }
        button:disabled, select:disabled { background: #555; cursor: not-allowed; }
        #field { position: relative; width: 400px; height: 250px; background: #1a1a2e; border: 2px solid #00f0ff; margin: 20px auto; overflow: hidden; user-select: none; touch-action: none; }
        .sector { position: absolute; border: 1px solid rgba(255,255,255,0.3); transition: background 0.1s; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-size: 12px; pointer-events: none; }
        .sector.highlight { background: rgba(255, 0, 100, 0.8); border: 2px solid #ff0; z-index: 2; transform: scale(1.02); }
        #clickMarker { position: absolute; width: 10px; height: 10px; background: #0f0; border-radius: 50%; pointer-events: none; display: none; z-index: 10; }
        #message { margin-top: 10px; font-size: 20px; color: #ff0; min-height: 30px; }
        #result { margin-top: 10px; font-size: 16px; color: #ccc; white-space: pre-line; }
        #controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        select { background: #333; }
        #debug { color: #aaa; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>
    <h1>⚽ Сэйв: Пенальти</h1>
    <div id="balance">Баланс: <span id="bal">0</span> ₽</div>
    <div id="controls">
        <button onclick="deposit()">Пополнить на 1000 ₽</button>
        <label for="stakeSelect">Ставка:</label>
        <select id="stakeSelect">
            <option value="100">100 ₽</option>
            <option value="200">200 ₽</option>
            <option value="500">500 ₽</option>
            <option value="1000">1000 ₽</option>
        </select>
        <button id="playBtn" onclick="startAttempt(false)">Играть на деньги</button>
        <button id="trainBtn" onclick="startAttempt(true)">Тренировка (бесплатно)</button>
    </div>
    <div id="field">
        <div id="clickMarker"></div>
    </div>
    <div id="debug"></div>
    <div id="message"></div>
    <div id="result"></div>

    <script>
        let balance = 0;
        let currentTrack = null;
        let currentStake = 100;
        let currentShot = 0;
        let attemptActive = false;
        let clickResult = [];
        let isTraining = false;
        const REACTION_WINDOW_MS = 500;

        async function fetchBalance() {
            const resp = await fetch('/api/balance');
            const data = await resp.json();
            balance = data.balance;
            document.getElementById('bal').textContent = balance;
            updateButtons();
        }

        function updateButtons() {
            const playBtn = document.getElementById('playBtn');
            const trainBtn = document.getElementById('trainBtn');
            const stakeSelect = document.getElementById('stakeSelect');
            const disabled = attemptActive || balance < 100;
            playBtn.disabled = disabled;
            trainBtn.disabled = attemptActive;
            stakeSelect.disabled = attemptActive;
        }

        async function deposit() {
            await fetch('/api/deposit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({amount: 1000})
            });
            fetchBalance();
        }

        async function startAttempt(training = false) {
            if (attemptActive) return;
            isTraining = training;
            currentStake = parseInt(document.getElementById('stakeSelect').value);

            if (!training && balance < currentStake) {
                alert('Недостаточно средств');
                return;
            }

            let response;
            if (training) {
                response = await fetch('/api/training');
            } else {
                response = await fetch('/api/attempt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({stake: currentStake})
                });
            }

            const data = await response.json();
            if (data.error) {
                alert(data.error);
                return;
            }

            currentTrack = data.track;
            if (!training) {
                balance = data.balance;
                document.getElementById('bal').textContent = balance;
            }

            attemptActive = true;
            updateButtons();
            currentShot = 0;
            clickResult = [];
            document.getElementById('message').textContent = '';
            document.getElementById('result').textContent = '';
            document.getElementById('debug').textContent = '';
            startShot();
        }

        function startShot() {
            if (currentShot >= 5) {
                endAttempt();
                return;
            }
            const shot = currentTrack[currentShot];
            const sector = shot.sector;
            const promptTime = shot.prompt_time * 1000;
            document.getElementById('debug').textContent = `Удар ${currentShot+1}: ждём подсветки...`;

            let shotHandled = false; // для предотвращения повторной обработки

            setTimeout(() => {
                if (!attemptActive || shotHandled) return;
                highlightSector(sector);
                document.getElementById('debug').textContent = `Удар ${currentShot+1}: бей в сектор ${sector}!`;
                const startTime = Date.now();
                const field = document.getElementById('field');
                const marker = document.getElementById('clickMarker');

                // Единый обработчик для mousedown и touchstart
                const handleInput = function(e) {
                    // Немедленно удаляем все слушатели, чтобы предотвратить двойное срабатывание
                    field.removeEventListener('mousedown', handleInput);
                    field.removeEventListener('touchstart', handleInput);

                    if (!attemptActive || shotHandled) return;
                    e.preventDefault();
                    e.stopPropagation();
                    shotHandled = true;

                    let clientX, clientY;
                    if (e.touches) {
                        // touch событие
                        clientX = e.touches[0].clientX;
                        clientY = e.touches[0].clientY;
                    } else {
                        // mouse событие
                        clientX = e.clientX;
                        clientY = e.clientY;
                    }

                    const rect = field.getBoundingClientRect();
                    const x = clientX - rect.left;
                    const y = clientY - rect.top;
                    const clickedSector = getSectorFromCoords(x, y, rect.width, rect.height);
                    const reactionTime = Date.now() - startTime;

                    // Визуализация касания
                    marker.style.left = x + 'px';
                    marker.style.top = y + 'px';
                    marker.style.display = 'block';
                    setTimeout(() => marker.style.display = 'none', 200);

                    console.log(`Касание: (${Math.round(x)}, ${Math.round(y)}), сектор=${clickedSector}, ожидался=${sector}, реакция=${reactionTime}мс`);
                    document.getElementById('debug').textContent = `Вы попали в сектор ${clickedSector}`;

                    clickResult.push({
                        sector_clicked: clickedSector,
                        reaction_time_ms: reactionTime,
                        correct_sector: sector
                    });

                    clearHighlight();
                    currentShot++;
                    setTimeout(startShot, 500);
                };

                field.addEventListener('mousedown', handleInput);
                field.addEventListener('touchstart', handleInput, {passive: false});

                // Автопромах, если время вышло
                setTimeout(() => {
                    if (attemptActive && !shotHandled && clickResult.length === currentShot) {
                        shotHandled = true;
                        field.removeEventListener('mousedown', handleInput);
                        field.removeEventListener('touchstart', handleInput);
                        clickResult.push({
                            sector_clicked: -1,
                            reaction_time_ms: REACTION_WINDOW_MS,
                            correct_sector: sector
                        });
                        clearHighlight();
                        document.getElementById('debug').textContent = 'Промах: время вышло';
                        currentShot++;
                        setTimeout(startShot, 500);
                    }
                }, REACTION_WINDOW_MS);
            }, promptTime);
        }

        function highlightSector(sector) {
            const sectors = document.querySelectorAll('.sector');
            sectors.forEach(s => s.classList.remove('highlight'));
            if (sector >=0 && sector < 9) {
                sectors[sector].classList.add('highlight');
            }
        }

        function clearHighlight() {
            const sectors = document.querySelectorAll('.sector');
            sectors.forEach(s => s.classList.remove('highlight'));
        }

        function getSectorFromCoords(x, y, width, height) {
            const col = Math.floor(x / (width / 3));
            const row = Math.floor(y / (height / 3));
            if (col < 0 || col > 2 || row < 0 || row > 2) return -1;
            return row * 3 + col;
        }

        async function endAttempt() {
            attemptActive = false;
            updateButtons();
            document.getElementById('debug').textContent = '';

            if (isTraining) {
                const saved = clickResult.filter(r => r.sector_clicked === r.correct_sector).length;
                document.getElementById('message').textContent = `Тренировка: отбито ${saved}/5`;
                document.getElementById('result').textContent = formatResult(clickResult);
                return;
            }

            const resp = await fetch('/api/submit_result', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    stake: currentStake,
                    results: clickResult
                })
            });
            const data = await resp.json();
            if (data.error) {
                document.getElementById('result').textContent = 'Ошибка: ' + data.error;
            } else {
                balance = data.balance;
                document.getElementById('bal').textContent = balance;
                document.getElementById('message').textContent = data.message;
                document.getElementById('result').textContent = formatResult(clickResult);
            }
        }

        function formatResult(results) {
            const dirs = ['левый верх','центр верх','правый верх','левый центр','центр','правый центр','левый низ','центр низ','правый низ'];
            let text = 'Детали ударов:\n';
            results.forEach((r, i) => {
                const dir = dirs[r.correct_sector] || 'неизв.';
                const hit = r.sector_clicked === r.correct_sector;
                text += `Удар ${i+1}: ${hit ? '✅ Отбит' : '❌ Пропущен'} (${dir}, реакция ${r.reaction_time_ms}мс)\n`;
            });
            return text;
        }

        function createField() {
            const field = document.getElementById('field');
            const w = field.clientWidth / 3;
            const h = field.clientHeight / 3;
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const div = document.createElement('div');
                    div.className = 'sector';
                    div.style.left = col * w + 'px';
                    div.style.top = row * h + 'px';
                    div.style.width = w + 'px';
                    div.style.height = h + 'px';
                    const idx = row * 3 + col;
                    div.dataset.sector = idx;
                    div.textContent = idx;
                    field.appendChild(div);
                }
            }
        }

        window.onload = () => {
            createField();
            fetchBalance();
        };
    </script>
</body>
</html>
